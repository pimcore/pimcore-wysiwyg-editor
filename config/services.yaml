services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    #
    # INSTALLER
    #
    Pimcore\Bundle\WysiwygEditor\Installer:
        public: true
        arguments:
            $bundle: "@=service('kernel').getBundle('PimcoreWysiwygEditor')"

    # controllers are imported separately to make sure they're public
    # and have a tag that allows actions to type-hint services
    Pimcore\Bundle\WysiwygEditor\Controller\:
        resource: '../src/Controller'
        public: true
        tags: [ 'controller.service_arguments' ]

    #
    # STUDIO SETTINGS
    #
    # hands the configured persistence format to the Studio frontend
    Pimcore\Bundle\WysiwygEditor\Setting\WysiwygSettingsProvider:
        arguments:
            $persistenceFormat: '%pimcore_wysiwyg_editor.persistence_format%'
        tags: [ 'pimcore.studio_backend.settings_provider' ]
